      - name: 🔍 Проверка синтаксиса PHP (Linting)
        run: |
          echo "🔍 Запуск проверки синтаксиса..."
          shopt -s globstar
          error_found=false
          
          for f in **/*.php; do
            # Пропускаем папку vendor, если она вдруг попала
            if [[ "$f" == vendor/* ]]; then continue; fi
            
            output=$(php -l "$f" 2>&1)
            if [[ "$output" != *"No syntax errors detected"* ]]; then
              echo "❌ Ошибка в файле: $f"
              echo "$output"
              error_found=true
            fi
          done
          
          if [ "$error_found" = true ]; then
            exit 1
          else
            echo "✅ Синтаксис в порядке"
          fi