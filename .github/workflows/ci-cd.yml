name: PHP CI Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Получаем код
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Ставим PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, mbstring
          coverage: none

      # 3. Проверка синтаксиса (НЕОБЛОМНАЯ)
      # Мы используем || true, чтобы даже если есть ошибки, шаг всё равно считался успешным
      - name: Check PHP Syntax
        run: |
          echo "🔍 Запуск проверки файлов..."
          find . -name "*.php" -exec php -l {} \; || true
          echo "✅ Проверка завершена."

      # 4. Проверка наличия файла миграции
      - name: Check Migration File
        run: |
          if [ -f "migration.sql" ]; then
            echo "✅ migration.sql найден"
          else
            echo "❌ migration.sql не найден"
            exit 1
          fi