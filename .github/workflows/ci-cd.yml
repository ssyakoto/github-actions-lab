name: PHP CI Pipeline with Unit Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Unit Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Получение кода
        uses: actions/checkout@v4

      - name: ⚙️ Установка PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, mbstring, json
          coverage: none

      - name: 📦 Установка зависимостей (Composer)
        run: composer install --no-interaction --prefer-dist

      - name: 🔍 Проверка синтаксиса PHP
        run: |
          echo "🔍 Проверка синтаксиса..."
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \; | grep -v "No syntax errors" || true

      - name: 🧪 Запуск Unit-тестов (PHPUnit)
        run: vendor/bin/phpunit